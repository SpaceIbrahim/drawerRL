# =============================================================================
# ArUco markers.  Print them with:  python scripts/vision/generate_markers.py
# `size` is the side length of the BLACK square (m) -- measure the printout!
#
# Frames used below (same as configs/drawer.yaml):
#   cabinet  : bottom-centre of the carcass front edge, +x into cabinet, +y left
#              (looking at the front), +z up
#   drawer_front : centre of the top drawer's front face, same axes as cabinet,
#              moves with the drawer
#   base     : robot base frame (+x forward, +z up)
# orientation presets:
#   facing_out : stuck flat on a front face, upright, readable from the front
#   facing_up  : lying flat on a horizontal surface, top edge pointing into the cabinet (+x)
#   or give rpy_deg: [roll, pitch, yaw] of the tag frame in the parent frame
# Tag frame (OpenCV convention): origin at the tag centre, x right, y up, z out of the tag.
# =============================================================================

dictionary: DICT_4X4_50
detector:
  corner_refinement: SUBPIX     # NONE | SUBPIX | CONTOUR | APRILTAG
  min_marker_perimeter_rate: 0.02
  adaptive_thresh_win_size_max: 33

# Tag(s) on the moving top drawer -- at least one REQUIRED.
# Default: two 7 cm tags, centred 11.5 cm left and right of the handle centre, at
# handle height.  The handle sticks out 3 cm, so from an oblique camera it hides
# the tag on the FAR side; with one tag on each side one is always clear, and the
# gripper can never cover both.  Every visible drawer tag is fused.
drawer:
  - id: 0
    size: 0.07
    frame: drawer_front
    position: [0.0, 0.115, 0.0]     # left of the handle (seen from the front)
    orientation: facing_out
  - id: 2
    size: 0.07
    frame: drawer_front
    position: [0.0, -0.115, 0.0]    # right of the handle (seen from the front)
    orientation: facing_out

# Optional static tag on the cabinet (recommended: lets the pipeline measure the
# opening even if the cabinet is bumped).  Default: on top, near the front-left.
cabinet:
  enabled: false
  id: 1
  size: 0.05
  frame: cabinet
  position: [0.06, 0.10, 0.49]
  orientation: facing_up

# Tags at KNOWN poses in the robot base frame, used by the "base_markers"
# extrinsic calibration and (optionally) for live re-calibration every frame.
base_markers:
  - id: 10
    size: 0.10
    frame: base
    position: [0.32, -0.20, 0.0]   # measured from the centre of the robot base; keep it clear of the arm and in view
    orientation: facing_up
    rpy_deg: null

# Tag mounted on the gripper for hand-eye calibration (its pose on the gripper is
# solved by the calibration, it does not need to be measured).
gripper_marker:
  id: 20
  size: 0.04

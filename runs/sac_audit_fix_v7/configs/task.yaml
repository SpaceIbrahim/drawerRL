control:
  frequency_hz: 20
  mode: ee_delta
  ee_max_step: 0.0125
  ee_target_lead_steps: 1.5
  ee_rotation_actions: yaw
  ee_max_rot_step: 0.05
  ee_max_yaw_deg: 30.0
  joint_max_step: 0.05
  ik_damping: 0.05
  ik_rot_weight: 0.5
  target_orientation:
    approach:
    - 1.0
    - 0.0
    - 0.0
    finger:
    - 0.0
    - 0.0
    - 1.0
  gripper_max_speed: 1.5
  gripper_mode: continuous
  workspace:
    low:
    - 0.1
    - -0.35
    - 0.05
    high:
    - 0.85
    - 0.35
    - 0.65
episode:
  max_steps: 200
  success_opening: 0.15
  success_hold_steps: 5
  success_requires_grasp: true
  terminate_on_success: false
observation:
  include:
  - joint_pos
  - joint_vel
  - gripper_pos
  - tcp_pos
  - tcp_rot6d
  - handle_pos
  - handle_to_tcp
  - drawer_axis
  - drawer_opening
  - last_action
  noise:
    joint_pos: 0.002
    joint_vel: 0.02
    tcp_pos: 0.001
    handle_pos: 0.003
    drawer_opening: 0.002
    drawer_axis: 0.02
reward:
  weights:
    reach: 1.0
    align: 0.5
    grasp: 2.0
    open: 6.0
    open_progress: 30.0
    success: 10.0
    off_axis: 1.0
    collision: 2.0
    finger_contact: 0.5
    drawer_speed: 5.0
    handle_side_force: 1.0
    torque_saturation: 0.5
    action: 0.01
    action_rate: 0.02
    joint_vel: 0.001
  reach_scale: 10.0
  align_power: 8
  grasp_requires_both_fingers: true
  grasp_max_gripper_open: 0.6
  open_requires_grasp: true
  max_drawer_speed: 0.25
  handle_side_force_free_N: 5.0
  handle_side_force_scale_N: 10.0
  torque_free_fraction: 0.85
randomization:
  drawer_xy:
  - 0.02
  - 0.02
  drawer_offset_x:
  - -0.06
  - 0.09
  drawer_offset_y:
  - -0.02
  - 0.02
  validate_reachability: true
  drawer_z: 0.01
  drawer_yaw_deg: 0.0
  drawer_yaw_range_deg:
  - -15.0
  - 15.0
  placement_map: configs/placement_map.yaml
  placement_map_erode: 1
  slide_damping_scale:
  - 0.6
  - 1.6
  slide_friction_scale:
  - 0.6
  - 1.6
  handle_friction_scale:
  - 0.8
  - 1.2
  actuator_kp_scale:
  - 0.9
  - 1.1
  initial_opening:
  - 0.0
  - 0.01
  action_delay_steps:
  - 0
  - 1
  gripper_force_scale:
  - 0.5
  - 1.2
  handle_obs_bias_m: 0.005
